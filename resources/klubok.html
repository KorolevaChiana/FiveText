<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Complex Clubok</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
      height: 100%;
      width: 100%;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script>
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    // Более сложная форма клубка
    const geometry = new THREE.TorusKnotGeometry(
      2,    // радиус
      0.15, // толщина трубы
      600,  // сегментов по длине
      32,  // сегментов по окружности
      5,    // число витков (p)
      13    // число поворотов (q)
    );

    const material = new THREE.MeshStandardMaterial({
      color: 0x88ccff,
      metalness: 0.7,
      roughness: 0.2,
      wireframe: false
    });

    const knot = new THREE.Mesh(geometry, material);
    scene.add(knot);

    // Свет
    const light1 = new THREE.PointLight(0xffffff, 2, 200);
    light1.position.set(5, 5, 5);
    scene.add(light1);

    const light2 = new THREE.PointLight(0xff00ff, 1, 200);
    light2.position.set(-5, -5, -5);
    scene.add(light2);

    const light3 = new THREE.DirectionalLight(0xffffff, 0.7);
    light3.position.set(0, 10, 10);
    scene.add(light3);

    camera.position.z = 5;

    // Анимация
    function animate() {
      requestAnimationFrame(animate);
      knot.rotation.x += 0.003;
      knot.rotation.y += 0.006;
      renderer.render(scene, camera);
    }
    animate();

    // Автоматический ресайз
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
