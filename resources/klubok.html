<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Kaleidoscope</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; background: #000; height: 100%; width: 100%; }
    canvas { display: block; }
  </style>
</head>
<body>
  <!-- Подключаем Three.js и дополнительные скрипты постобработки -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.min.js"></script>
  <script src="https://threejs.org/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://threejs.org/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://threejs.org/examples/js/postprocessing/ShaderPass.js"></script>
  <script src="https://threejs.org/examples/js/shaders/KaleidoShader.js"></script>
  <script>
    // Сцена и камера
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 4;
    // Рендерер на весь экран
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);
    // Создание группы "стекляшек" (цветных фрагментов)
    const pieces = [];
    const pieceCount = 20;
    const maxX = 4, maxY = 3;
    for (let i = 0; i < pieceCount; i++) {
      // Случайная геометрия фрагмента: круг или треугольник
      let geometry;
      if (Math.random() < 0.5) {
        geometry = new THREE.CircleGeometry(0.2 + Math.random() * 0.2, 16);
      } else {
        geometry = new THREE.BufferGeometry();
        const vertices = new Float32Array([
          0, 0.3 + Math.random()*0.2, 0,
          -0.3 - Math.random()*0.2, -0.3 - Math.random()*0.2, 0,
          0.3 + Math.random()*0.2, -0.3 - Math.random()*0.2, 0
        ]);
        geometry.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
      }
      // Материал BasicMaterial яркого случайного цвета (без освещения)
      const material = new THREE.MeshBasicMaterial({ color: Math.random() * 0xffffff, side: THREE.DoubleSide });
      const mesh = new THREE.Mesh(geometry, material);
      // Случайная начальная позиция в пределах видимой области
      mesh.position.x = (Math.random() * 2 - 1) * maxX;
      mesh.position.y = (Math.random() * 2 - 1) * maxY;
      mesh.position.z = 0;
      // Случайный поворот вокруг Z (для несимметричных форм)
      mesh.rotation.z = Math.random() * Math.PI * 2;
      scene.add(mesh);
      // Сохраняем объект и его скорость
      pieces.push({
        mesh: mesh,
        vx: (Math.random() * 0.01) - 0.005, // скорость по X (-0.005..0.005)
        vy: (Math.random() * 0.01) - 0.005  // скорость по Y
      });
    }
    // Постобработка: эффект калейдоскопа
    const composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));
    const kaleidoPass = new THREE.ShaderPass(THREE.KaleidoShader);
    kaleidoPass.uniforms['sides'].value = 6;   // 6 секций симметрии (3 зеркала)
    kaleidoPass.uniforms['angle'].value = 0.0; // начальный угол поворота узора
    kaleidoPass.renderToScreen = true;         // выводим финальное изображение на экран
    composer.addPass(kaleidoPass);
    // Анимация сцены
    function animate() {
      requestAnimationFrame(animate);
      // Обновляем позиции фрагментов
      for (const item of pieces) {
        const m = item.mesh;
        m.position.x += item.vx;
        m.position.y += item.vy;
        // Меняем направление при выходе за границы области
        if (m.position.x > maxX || m.position.x < -maxX) item.vx = -item.vx;
        if (m.position.y > maxY || m.position.y < -maxY) item.vy = -item.vy;
      }
      // Плавно поворачиваем весь узор калейдоскопа
      kaleidoPass.uniforms['angle'].value += 0.005;
      // Рендерим сцену с пост-эффектом
      composer.render();
    }
    animate();
    // Автоматический ресайз канвы и эффектов при изменении окна
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
