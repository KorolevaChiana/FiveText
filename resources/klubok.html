<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kaleidoscope + Clubok</title>
  <style>
    body, html { margin: 0; padding: 0; overflow: hidden; background: #000; }
    canvas { display: block; }
  </style>
</head>
<body>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.158.0/build/three.module.js";
import { OrbitControls } from "https://cdn.jsdelivr.net/npm/three@0.158.0/examples/jsm/controls/OrbitControls.js";

// Сцена и камера
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
camera.position.z = 4;

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
document.body.appendChild(renderer.domElement);

// === Фон-шейдер (калейдоскоп) ===
const uniforms = {
  time: { value: 0.0 },
  resolution: { value: new THREE.Vector2(window.innerWidth, window.innerHeight) }
};

const kaleidoMaterial = new THREE.ShaderMaterial({
  uniforms,
  vertexShader: `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0);
    }
  `,
  fragmentShader: `
    uniform float time;
    uniform vec2 resolution;
    varying vec2 vUv;

    void main() {
      vec2 uv = vUv - 0.5;
      float angle = atan(uv.y, uv.x);
      float radius = length(uv) * 3.0;

      // делаем 6-секционную симметрию (как 3 зеркала)
      float n = 6.0;
      angle = mod(angle, 2.0*3.141592/n);
      angle = abs(angle - 3.141592/n/2.0);

      // простая динамика
      float stripe = sin(radius*10.0 + time*2.0 + angle*5.0);

      // серые тона
      vec3 col = vec3(0.5 + 0.5*stripe);

      gl_FragColor = vec4(col, 1.0);
    }
  `,
  side: THREE.DoubleSide
});

const plane = new THREE.Mesh(new THREE.PlaneGeometry(20, 20), kaleidoMaterial);
plane.position.z = -5;
scene.add(plane);

// === Клубок ===
const knotGeom = new THREE.TorusKnotGeometry(1.5, 0.4, 256, 32);
const knotMat = new THREE.MeshStandardMaterial({ color: 0x8888ff, metalness: 0.7, roughness: 0.2 });
const knot = new THREE.Mesh(knotGeom, knotMat);
scene.add(knot);

// Свет
const light1 = new THREE.PointLight(0xffffff, 2, 150);
light1.position.set(5, 5, 5);
scene.add(light1);

const light2 = new THREE.PointLight(0xff00ff, 1, 150);
light2.position.set(-5, -5, -5);
scene.add(light2);

const light3 = new THREE.DirectionalLight(0xffffff, 0.5);
light3.position.set(0, 5, 5);
scene.add(light3);

// Анимация
function animate(timeMs) {
  requestAnimationFrame(animate);
  uniforms.time.value = timeMs * 0.001;

  knot.rotation.x += 0.005;
  knot.rotation.y += 0.005;

  renderer.render(scene, camera);
}
animate();

// Ресайз
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  uniforms.resolution.value.set(window.innerWidth, window.innerHeight);
});
</script>
</body>
</html>
