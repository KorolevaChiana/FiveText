      <h1 style="color:#8b949e; font-size:16px; margin:15px; font-weight:normal; text-align: center;">
    Синдикат «Эволюция паразитов. Спонтанная сборка криминального синдиката.
  </h1>
    
    <iframe src="https://korolevachiana.github.io/FiveText/resources/plesenE.html"></iframe>

  <script>
    // Настройки репозитория
    const repoOwner = 'KorolevaChiana';
    const repoName = 'FiveText';
    const basePath = 'CriminalSyndicate';

    async function fetchDirectoryContent(path) {
        const apiUrl = `https://api.github.com/repos/${repoOwner}/${repoName}/contents/${path}`;
        try {
            const response = await fetch(apiUrl);
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }
            return await response.json();
        } catch (error) {
            console.error('Ошибка загрузки директории:', error);
            return null;
        }
    }

    function createFileLink(file) {
        const li = document.createElement('li');
        li.className = 'file-item';
        const a = document.createElement('a');
        a.className = 'file-link';
        // Прямая ссылка на файл через GitHub Pages
        a.href = `https://${repoOwner.toLowerCase()}.github.io/${repoName}/${file.path}`;
        a.textContent = file.name;
        a.target = '_blank'; // Открывает файл в новой вкладке
        li.appendChild(a);
        return li;
    }

    async function buildExplorerTree(containerElem, currentPath) {
        const items = await fetchDirectoryContent(currentPath);
        
        if (!items) {
            containerElem.innerHTML = '<div class="error-msg">Ошибка связи с архивом GitHub.</div>';
            return;
        }

        containerElem.innerHTML = ''; 

        const fileList = document.createElement('ul');
        fileList.className = 'file-list';
        fileList.style.display = 'block'; // Корень всегда открыт

        for (const item of items) {
            if (item.type === 'file') {
                fileList.appendChild(createFileLink(item));
            } else if (item.type === 'dir') {
                const folderDiv = document.createElement('div');
                folderDiv.className = 'folder';
                
                const folderName = document.createElement('div');
                folderName.className = 'folder-name';
                folderName.innerHTML = `<span class="folder-icon"></span>${item.name}`;
                
                const subFileList = document.createElement('ul');
                subFileList.className = 'file-list';
                
                folderName.onclick = async () => {
                    folderDiv.classList.toggle('open');
                    // Динамическая подгрузка вложенных папок
                    if (folderDiv.classList.contains('open') && subFileList.children.length === 0) {
                        subFileList.innerHTML = '<li class="loading-msg">Расшифровка...</li>';
                        const subItems = await fetchDirectoryContent(item.path);
                        subFileList.innerHTML = '';
                        if (subItems) {
                             for (const subItem of subItems) {
                                 if(subItem.type === 'file') {
                                      subFileList.appendChild(createFileLink(subItem));
                                 } else if (subItem.type === 'dir') {
                                     const subFolderDiv = document.createElement('div');
                                     subFolderDiv.className = 'folder';
                                     subFolderDiv.innerHTML = `<div class="folder-name" onclick="this.parentElement.classList.toggle('open'); loadSubFolder(this.parentElement, '${subItem.path}')"><span class="folder-icon"></span>${subItem.name}</div><ul class="file-list"></ul>`;
                                     subFileList.appendChild(subFolderDiv);
                                 }
                             }
                        } else {
                             subFileList.innerHTML = '<li class="error-msg">Ошибка загрузки</li>';
                        }
                    }
                };
                
                folderDiv.appendChild(folderName);
                folderDiv.appendChild(subFileList);
                fileList.appendChild(folderDiv);
            }
        }
        
        containerElem.appendChild(fileList);
    }
    
    window.loadSubFolder = async function(folderElement, path) {
        const listElement = folderElement.querySelector('.file-list');
        if (folderElement.classList.contains('open') && listElement.children.length === 0) {
             listElement.innerHTML = '<li class="loading-msg">Расшифровка...</li>';
             const subItems = await fetchDirectoryContent(path);
             listElement.innerHTML = '';
             if (subItems) {
                  for (const subItem of subItems) {
                      if(subItem.type === 'file') {
                           listElement.appendChild(createFileLink(subItem));
                      }
                  }
             } else {
                  listElement.innerHTML = '<li class="error-msg">Ошибка</li>';
             }
        }
    }

    document.addEventListener('DOMContentLoaded', () => {
        const explorerContent = document.getElementById('explorer-content');
        buildExplorerTree(explorerContent, basePath);
    });
  </script>
